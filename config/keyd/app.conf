# ~/.config/keyd/app.conf
# https://bugs.kde.org/show_bug.cgi?id=427214#c46

[org-kde-plasmashell|clipboard-popup]

enter = macro(S-enter 200ms C-v)

# Typing Ctrl+enter will result in normal behaviour.
# I.E. Just a copy without paste
control.enter = enter

[org-kde-plasma-emojier]
enter = macro(enter 10ms A-f4 500ms C-v)
control.enter = enter

#Launch the program with the following command:
# keyd-application-mapper --daemonize
